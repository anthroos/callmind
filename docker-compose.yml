services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    # No published port: only the callmind container talks to Qdrant.
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  callmind:
    build: .
    # Published on localhost only. Put an authenticating proxy in front before exposing it.
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
      - CALLMIND_HOST=0.0.0.0
    depends_on:
      - qdrant
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

volumes:
  qdrant_data:
